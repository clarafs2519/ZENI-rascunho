<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="tudo">
    <section class="bemvindo">
        
        <h1>BEM-VINDO </h1>
        <h1 class="devolta">DE VOLTA</h1>
        <h5>Acesse sua conta para gerenciar suas finanças</h5>
        
        <!-- <img src="./img/Logo Zeni em bronze e preto.png" alt="Logo"> -->
        
    </section>

    <section class="login">
        <form action="/paginas/dashboard.html" method="GET">     
        <label for="nome"><h4>E-mail:</h4></label> <br>
        <input type="text" id="email" name="nome" placeholder="seuemail@exemplo.com.br" required><br>

        <label for="email"><h4>Senha:</h4></label> <br>
        <input type="senha" id="senha" name="senha" placeholder="*************" required><br>
        
   
        <button type="submit"><h4>Entrar na conta</h4></button>
        
        </form>

        
        <div class="criarconta">
        <a href="./paginas/criarconta.html">
        <h5>Não tem uma conta? Crie sua conta</h5>
       </a>
       </div>
      
    </section>
    </div>

</body>
</html>
