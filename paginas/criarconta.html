<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/paginas/criarconta.css">

</head>
<body>

    <div class="pagina">

    <div class="tudoinformacao">
    <section class="informacao">
        <h1>INFORMAÇÕES PESSOAIS</h1>
        <h5>Preencha os dados conforme o documento oficial</h5>


        <form action="/index.html">
        <label for="nome"><h4>Nome:</h4></label>
        <input type="text" id="nome" name="nome" placeholder="Seu nome" required>

        <label for="sobrenome"><h4>Sobrenome:</h4></label> 
        <input type="senha" id="senha" name="senha" placeholder="sobrenome" required>
        
        <label for="cpf"><h4>Cpf:</h4></label> 
        <input type="senha" id="senha" name="senha" placeholder="***.***.***-**" required>
      
        
    
        <label for="cpf"><h4>Data nascimento:</h4></label> 
        <input type="senha" id="senha" name="senha" placeholder="**/**/****" required>

        <label for="cpf"><h4>Telefone:</h4></label> 
        <input type="senha" id="senha" name="senha" placeholder="(xx) xxxxx-xxxx" required>

    
        <label for="renda"><h4>Renda Mensal:</h4></label>
        <select id="renda" name="renda" required>
        <option value="" disabled selected>Selecione uma opção...</option>
        <option value="corrente">até R$1000</option>
        <option value="poupanca">R$1.000 á R$2.000</option>
        <option value="salario">R$7.000 á R$11.000</option>
        <option value="salario">R$11.000 á R$16.000</option>
     
        <option value="salario">Acima de R$1600</option>
       
        </select>



        <button type="submit"><h4>Concluir criação de conta</h4></button>
        

        </form>



    </section>
    </div>

    </div>

   
</body>
</html>
